<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild Frontier DTR</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wild Frontier DTR">
  <meta name="theme-color" content="#111111">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 400px;
      padding: 40px 25px;
    }

    .logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #cccccc;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      background: white;
      color: #111111;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="icon.png" alt="Wild Frontier DTR" class="logo">

    <h1>Wild Frontier DTR</h1>

    <p>Daily Time Report</p>

    <a
      class="button"
      href="https://docs.google.com/forms/d/e/1FAIpQLSf5ZsbD29b4IhjxRxMH36Y_Wv8hPFa4yu0yo1GTpdkdGLuT5A/viewform">
      Open Timesheet
    </a>
  </div>

</body>
</html>
